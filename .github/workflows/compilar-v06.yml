name: Compilar OBS Mobile RN v0.6 (teste)
on:
  workflow_dispatch:
  push:
    branches: [desenvolvimento-v0.6]
    paths:
      - 'android-source/**'
      - '.github/workflows/compilar-v06.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de teste
        working-directory: android-source
        run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OBS-Mobile-RN-v06-teste
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
