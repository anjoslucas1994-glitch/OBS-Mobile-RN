name: Compilar APK - OBS Mobile RN v0.68

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - desenvolvimento-v0.6
    paths:
      - "android-source/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar testes e compilar APK de depuração
        working-directory: android-source
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Confirmar pacote Android gerado
        run: |
          test -s android-source/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-source/app/build/outputs/apk/debug/app-debug.apk > /dev/null
          echo "APK existe e o arquivo ZIP está íntegro."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Mobile-RN-v0.68-debug
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
